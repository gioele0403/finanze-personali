<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: transparent;
    user-select: none;
    overflow: hidden;
  }
  .widget {
    background: rgba(15, 23, 42, 0.92);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(59, 130, 246, 0.3);
    border-radius: 14px;
    padding: 14px;
    width: 240px;
    color: #f9fafb;
    -webkit-app-region: drag;
  }
  .header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }
  .icon {
    width: 28px;
    height: 28px;
    background: #1a56db;
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }
  .title {
    font-size: 13px;
    font-weight: 600;
    color: #93c5fd;
    flex: 1;
  }
  .close-btn {
    width: 18px;
    height: 18px;
    background: rgba(255,255,255,0.1);
    border: none;
    border-radius: 50%;
    color: #9ca3af;
    font-size: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-app-region: no-drag;
  }
  .close-btn:hover { background: rgba(239,68,68,0.5); color: #fff; }
  .divider { border-top: 1px solid rgba(255,255,255,0.08); margin: 8px 0; }
  .saldo-totale {
    text-align: center;
    margin-bottom: 10px;
  }
  .saldo-label { font-size: 10px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.8px; }
  .saldo-value { font-size: 26px; font-weight: 700; color: #3b82f6; }
  .row-metrics {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-bottom: 10px;
  }
  .metric {
    background: rgba(255,255,255,0.05);
    border-radius: 8px;
    padding: 7px 8px;
  }
  .metric-label { font-size: 9px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 3px; }
  .metric-value { font-size: 14px; font-weight: 600; }
  .green { color: #0e9f6e; }
  .red { color: #e02424; }
  .conti-title { font-size: 10px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 6px; }
  .conto-row {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 4px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .conto-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .conto-nome { font-size: 12px; color: #d1d5db; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conto-saldo { font-size: 12px; font-weight: 600; }
  .tx-title { font-size: 10px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 6px; margin-top: 10px; }
  .tx-row {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 4px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .tx-arrow { font-size: 12px; width: 20px; text-align: center; flex-shrink: 0; }
  .tx-desc { font-size: 11px; color: #d1d5db; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tx-amount { font-size: 11px; font-weight: 600; flex-shrink: 0; }
  .refresh-btn {
    width: 100%;
    margin-top: 10px;
    padding: 5px;
    background: rgba(26,86,219,0.2);
    border: 1px solid rgba(26,86,219,0.4);
    border-radius: 6px;
    color: #93c5fd;
    font-size: 11px;
    cursor: pointer;
    -webkit-app-region: no-drag;
  }
  .refresh-btn:hover { background: rgba(26,86,219,0.4); }
  .loading { text-align: center; color: #6b7280; font-size: 12px; padding: 20px 0; }
</style>
</head>
<body>
<div class="widget">
  <div class="header">
    <div class="icon">💰</div>
    <span class="title">Finanze Personali</span>
    <button class="close-btn" onclick="window.electronAPI.closeWidget()">×</button>
  </div>
  <div id="content" class="loading">Caricamento...</div>
</div>

<script>
const SUPABASE_URL = "https://kxdyxybdainrgljyrfuc.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt4ZHl4eWJkYWlucmdsanlyZnVjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY1ODcyMzYsImV4cCI6MjA5MjE2MzIzNn0.EaUgVimHWeyazy2km-nONIQSxHs0njenZZSzXwZkh_E";

function fmt(n) {
  return new Intl.NumberFormat("it-IT", { style: "currency", currency: "EUR" }).format(n);
}

async function fetchData() {
  const hash = localStorage.getItem("finanze_auth");
  if (!hash) {
    document.getElementById("content").innerHTML = '<div class="loading">Apri prima l\'app principale e accedi.</div>';
    return;
  }

  const [cr, tr] = await Promise.all([
    fetch(`${SUPABASE_URL}/rest/v1/conti?user_hash=eq.${hash}&select=*`, { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }).then(r => r.json()),
    fetch(`${SUPABASE_URL}/rest/v1/transazioni?user_hash=eq.${hash}&select=*&order=data.desc`, { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }).then(r => r.json()),
  ]);

  const conti = cr || [];
  const transazioni = (tr || []).map(t => ({ ...t, contoId: t.conto_id }));

  function getSaldo(id) {
    return transazioni.filter(t => t.contoId === id).reduce((s, t) => t.tipo === "entrata" ? s + t.importo : s - t.importo, 0);
  }

  const saldoTotale = conti.reduce((s, c) => s + getSaldo(c.id), 0);
  const now = new Date();
  const mese = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const txMese = transazioni.filter(t => t.data && t.data.startsWith(mese));
  const entrate = txMese.filter(t => t.tipo === "entrata").reduce((s, t) => s + t.importo, 0);
  const uscite = txMese.filter(t => t.tipo === "uscita").reduce((s, t) => s + t.importo, 0);
  const ultime = transazioni.slice(0, 4);

  document.getElementById("content").innerHTML = `
    <div class="saldo-totale">
      <div class="saldo-label">Saldo totale</div>
      <div class="saldo-value" style="color:${saldoTotale>=0?"#3b82f6":"#e02424"}">${fmt(saldoTotale)}</div>
    </div>
    <div class="row-metrics">
      <div class="metric">
        <div class="metric-label">Entrate mese</div>
        <div class="metric-value green">${fmt(entrate)}</div>
      </div>
      <div class="metric">
        <div class="metric-label">Uscite mese</div>
        <div class="metric-value red">${fmt(uscite)}</div>
      </div>
    </div>
    <div class="divider"></div>
    <div class="conti-title">I tuoi conti</div>
    ${conti.map(c => `
      <div class="conto-row">
        <div class="conto-dot" style="background:${c.colore}"></div>
        <span class="conto-nome">${c.nome}</span>
        <span class="conto-saldo" style="color:${getSaldo(c.id)>=0?"#0e9f6e":"#e02424"}">${fmt(getSaldo(c.id))}</span>
      </div>
    `).join("")}
    <div class="tx-title">Ultimi movimenti</div>
    ${ultime.map(tx => `
      <div class="tx-row">
        <span class="tx-arrow" style="color:${tx.tipo==="entrata"?"#0e9f6e":"#e02424"}">${tx.tipo==="entrata"?"↑":"↓"}</span>
        <span class="tx-desc">${tx.descrizione||tx.categoria}</span>
        <span class="tx-amount" style="color:${tx.tipo==="entrata"?"#0e9f6e":"#e02424"}">${tx.tipo==="entrata"?"+":"-"}${fmt(tx.importo)}</span>
      </div>
    `).join("")}
    <button class="refresh-btn" onclick="fetchData()">↻ Aggiorna</button>
  `;
}

fetchData();
setInterval(fetchData, 60000);
</script>
</body>
</html>
